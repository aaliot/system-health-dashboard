global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: system-health
    static_configs:
      - targets: ["app-staging:5000"]
        labels:
          environment: staging
      - targets: ["app-production:5000"]
        labels:
          environment: production
