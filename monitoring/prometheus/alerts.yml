groups:
  - name: system-health
    rules:
      - alert: ServiceDown
        expr: up{job="system-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.environment }} application target has been down for 1 minute"

      - alert: HighErrorRate
        expr: |
          sum by (environment) (rate(http_requests_total{status=~"5.."}[2m]))
            / sum by (environment) (rate(http_requests_total[2m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.environment }}: more than 5% of requests returned 5xx over 2 minutes"
